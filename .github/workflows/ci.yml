name: Security Hub verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r hub/requirements.txt
      - run: python -m unittest discover -s hub -p 'test_store.py' -v
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/check_repository.py
      - run: docker build -t security-hub ./hub
